name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend DB Health Endpoint
        run: |
          API_URL="${{ secrets.BACKEND_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://workout-planner-production-66ce.up.railway.app"
          fi
          curl -sSf -X GET "$API_URL/health-db"
